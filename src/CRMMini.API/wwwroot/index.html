<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRM Mini</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="brand big"><span class="logo">C</span> CRM Mini</div>
      <p class="muted">Đăng nhập để quản lý khách hàng, cơ hội và công việc.</p>
      <label>Email hoặc tên đăng nhập
        <input name="id" value="staff@crmmini.local" autocomplete="username" required />
      </label>
      <label>Mật khẩu
        <input name="pw" type="password" autocomplete="current-password" required />
      </label>
      <button class="btn primary" type="submit">Đăng nhập</button>
      <div id="login-error" class="error"></div>
      <p class="muted small">Tài khoản mẫu: admin@ / manager@ / staff@crmmini.local</p>
    </form>
  </div>

  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">C</span> CRM Mini</div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="me" class="me"></div>
        <button id="logout" class="btn ghost full">Đăng xuất</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar"><h1 id="page-title"></h1><div id="page-actions"></div></header>
      <section id="page"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card">
    <h3 id="modal-title"></h3>
    <form id="modal-form"></form>
  </div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
